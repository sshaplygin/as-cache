name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every module has its own go.mod and is linted independently. Keep
        # this in step with MODULES in the Makefile.
        module: [".", "lfu", "policies", "policies/arc", "policies/fifo", "policies/tinylfu", "metrics", "bandit", "benchclient", "bench", "examples/basic", "examples/migration"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: golangci-lint
        # v7 of the action is required for golangci-lint v2.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          working-directory: ${{ matrix.module }}

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "lfu", "policies", "policies/arc", "policies/fifo", "policies/tinylfu", "metrics", "bandit", "benchclient", "bench", "examples/basic", "examples/migration"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -race -short -count=1 ./...

      # The examples carry no tests, so without this they are checked only for
      # compiling. Both ship a -smoke mode that drives the cache and exits, so
      # a runtime fault in example code fails CI instead of the first reader.
      - name: run the example
        if: startsWith(matrix.module, 'examples/')
        working-directory: ${{ matrix.module }}
        run: go run . -smoke

      - name: run the example across every migration strategy
        if: matrix.module == 'examples/migration'
        working-directory: ${{ matrix.module }}
        run: |
          for strategy in cold warm gradual; do
            go run . -strategy=$strategy -epoch=1 -smoke
          done

  # Build tracked candidate sources through a temporary module proxy with
  # GOWORK=off and fresh consumer caches. External dependencies need network.
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - run: make python-check script-test release-check
