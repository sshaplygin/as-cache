<svg xmlns="http://www.w3.org/2000/svg" width="808" height="310" viewBox="0 0 808 310" role="img" aria-label="Which policy is active over time on the phase-shift workload">

  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .muted   { fill: #52514e; }
    .accent  { fill: #2a78d6; }
    .context { fill: #c9c8c2; }
    .rule    { stroke: #c9c8c2; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .muted   { fill: #c3c2b7; }
      .accent  { fill: #3987e5; }
      .context { fill: #57565170; }
      .rule    { stroke: #3a3a37; }
    }
  </style>

