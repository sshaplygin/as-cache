<text class="muted" x="722" y="60" font-size="10">share</text>
<text class="muted" x="20" y="280" font-size="11">The bandit tries the arms (TwoQueue, ARC, LFU, LRU), finds TinyLFU and holds it 63% of the time:</text>
<text class="muted" x="20" y="296" font-size="11">on this workload it is the best in both regimes, and there is nothing to switch to.</text>
